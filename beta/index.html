<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>SB Live Lapse — Beta</title>
  <link rel="canonical" href="https://sb-live-lapse.com/beta/" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <h1 id="chartTitle">Santa Barbara Lapse Chart (Refreshed --- --/-- at --:--)</h1>
  <div class="toolbar">
    <button id="metricBtn" class="control-button is-active" type="button">Metric</button>
    <button id="imperialBtn" class="control-button" type="button">Imperial</button>
    <div class="snapshot-nav" role="group" aria-label="Snapshot navigation (Pacific time)">
      <button id="prevSnapshotBtn" class="control-button" type="button" aria-label="Previous snapshot">&#8592;</button>
      <select id="snapshotDay" class="snapshot-field" aria-label="Snapshot day (Pacific time)" disabled>
        <option value="">---</option>
      </select>
      <span aria-hidden="true">@</span>
      <input id="snapshotTime" class="snapshot-field" type="text" inputmode="numeric" maxlength="5"
        placeholder="--:--" aria-label="Snapshot time (Pacific, 24-hour)"
        title="Pacific time: enter HH:MM or HHMM. Press Enter or leave the field to jump to the nearest available snapshot."
        autocomplete="off" spellcheck="false" disabled />
      <button id="nextSnapshotBtn" class="control-button" type="button" aria-label="Next snapshot">&#8594;</button>
    </div>
    <a
      href="../faq.html"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >Help / FAQ</a>
    <a
      href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >Is today a good day to fly?</a>
  </div>
  <img id="chart" src="./sba_wwtemp_chart_metric.svg" alt="Santa Barbara lapse chart" />
  <section id="satelliteSection" class="satellite-section" aria-labelledby="satelliteHeading">
    <h2 id="satelliteHeading">GOES-West satellite · Southern California</h2>
    <p>Latest GeoColor image · independent of the chart’s selected time · <a href="https://www.star.nesdis.noaa.gov/GOES/wfo.php?wfo=lox" target="_blank" rel="noopener noreferrer">CIRA/NOAA</a></p>
    <p id="satelliteStatus" role="status">Loads after the chart, when this section is in view.</p>
    <button id="loadSatellite" class="control-button" type="button" disabled hidden>Load satellite image</button>
    <img id="satelliteImage" width="600" height="600" decoding="async" fetchpriority="low"
      alt="Latest GOES-West GeoColor satellite image of the Los Angeles/Oxnard region, including Santa Barbara; image time is printed on the image." hidden />
  </section>
</body>
</html>
