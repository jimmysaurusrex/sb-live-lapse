<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>SB Live Lapse — Beta</title>
  <link rel="canonical" href="https://sb-live-lapse.com/beta/" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <h1 id="chartTitle">Santa Barbara Lapse Chart (Refreshed --- --/-- at --:--)</h1>
  <div class="toolbar">
    <button id="metricBtn" class="control-button is-active" type="button">Metric</button>
    <button id="imperialBtn" class="control-button" type="button">Imperial</button>
    <div class="snapshot-nav" role="group" aria-label="Snapshot navigation (Pacific time)">
      <button id="prevSnapshotBtn" class="control-button" type="button" aria-label="Previous snapshot">&#8592;</button>
      <select id="snapshotDay" class="snapshot-field" aria-label="Snapshot day (Pacific time)" disabled>
        <option value="">---</option>
      </select>
      <span aria-hidden="true">@</span>
      <input id="snapshotTime" class="snapshot-field" type="text" inputmode="numeric" maxlength="5"
        placeholder="--:--" aria-label="Snapshot time (Pacific, 24-hour)"
        title="Pacific time: enter HH:MM or HHMM. Press Enter or leave the field to jump to the nearest available snapshot."
        autocomplete="off" spellcheck="false" disabled />
      <button id="nextSnapshotBtn" class="control-button" type="button" aria-label="Next snapshot">&#8594;</button>
    </div>
    <a
      href="../faq.html"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >Help / FAQ</a>
    <a
      href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >Is today a good day to fly?</a>
  </div>
  <img id="chart" src="./sba_wwtemp_chart_metric.svg" alt="Santa Barbara lapse chart" />
  <div class="imagery-grid">
  <section id="satelliteSection" class="satellite-section" aria-labelledby="satelliteHeading">
    <h2 id="satelliteHeading">GOES-WEST - Painted Cave to Rincon</h2>
    <p id="satelliteCaption" hidden></p>
    <p id="satelliteStatus" class="satellite-status" role="status">Loads after the chart, when this section is in view.</p>
    <button id="loadSatellite" class="control-button" type="button" disabled hidden>Load satellite image</button>
    <img id="satelliteImage" width="600" height="418" decoding="async" fetchpriority="low"
      aria-describedby="satelliteCaption" title="Satellite imagery: CIRA/NOAA. Coastline: Natural Earth."
      alt="GOES-West cloud imagery from Painted Cave to Rincon, with the coastline and Santa Barbara and Carpinteria marked. North is up; scan time is printed on each frame." hidden />
    <button id="playSatellite" class="control-button" type="button" disabled hidden>Play last hour</button>
  </section>
  <section id="gibraltarSection" class="camera-section" aria-labelledby="gibraltarHeading">
    <h2 id="gibraltarHeading"><a href="https://ops.alertcalifornia.org/cam-console/1985" target="_blank" rel="noopener noreferrer" title="ALERTCalifornia | UC San Diego">Gibraltar - South</a></h2>
    <p id="gibraltarCaption" hidden></p>
    <p id="gibraltarStatus" class="camera-status" role="status" hidden></p>
    <button id="gibraltarLoad" class="control-button" type="button" disabled hidden>Load camera image</button>
    <img id="gibraltarImage" width="600" height="366" decoding="async" fetchpriority="low"
      aria-describedby="gibraltarCaption" title="ALERTCalifornia | UC San Diego"
      alt="Tight south-facing crop from the latest Gibraltar 1 panorama." hidden />
  </section>
  <section id="tvhillSection" class="camera-section panorama-section" aria-labelledby="tvhillHeading">
    <h2 id="tvhillHeading"><a href="https://ops.alertcalifornia.org/cam-console/2748" target="_blank" rel="noopener noreferrer" title="ALERTCalifornia | UC San Diego">TV Hill - North</a></h2>
    <p id="tvhillCaption" hidden></p>
    <p id="tvhillStatus" class="camera-status" role="status" hidden></p>
    <button id="tvhillLoad" class="control-button" type="button" disabled hidden>Load camera image</button>
    <img id="tvhillImage" width="1200" height="170" decoding="async" fetchpriority="low"
      aria-describedby="tvhillCaption" title="ALERTCalifornia | UC San Diego"
      alt="Full TV Hill 2 panorama centered north, with compass directions." hidden />
  </section>
  <section id="ortegaSection" class="camera-section panorama-section" aria-labelledby="ortegaHeading">
    <h2 id="ortegaHeading"><a href="https://ops.alertcalifornia.org/cam-console/2761" target="_blank" rel="noopener noreferrer" title="ALERTCalifornia | UC San Diego">Ortega Ridge - West</a></h2>
    <p id="ortegaCaption" hidden></p>
    <p id="ortegaStatus" class="camera-status" role="status" hidden></p>
    <button id="ortegaLoad" class="control-button" type="button" disabled hidden>Load camera image</button>
    <img id="ortegaImage" width="1200" height="170" decoding="async" fetchpriority="low"
      aria-describedby="ortegaCaption" title="ALERTCalifornia | UC San Diego"
      alt="Full Ortega Ridge 1 panorama centered west, with compass directions." hidden />
  </section>
  </div>
</body>
</html>
