<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SB Live Lapse</title>
  <link rel="canonical" href="https://sb-live-lapse.com/" />
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="./app.js"></script>
</head>
<body>
  <h1 id="chartTitle">Santa Barbara Lapse Chart (Refreshed --- --/-- at --:--)</h1>
  <div class="toolbar">
    <button id="metricBtn" class="control-button is-active" type="button">Metric</button>
    <button id="imperialBtn" class="control-button" type="button">Imperial</button>
    <button id="prevSnapshotBtn" class="control-button" type="button">&#8592;</button>
    <button id="nextSnapshotBtn" class="control-button" type="button">&#8594;</button>
    <a
      href="https://en.wikipedia.org/wiki/Radio_acoustic_sounding_system"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >What is RASS?</a>
    <a
      href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ"
      target="_blank"
      rel="noopener noreferrer"
      class="toolbar-link"
    >Is today a good day to fly?</a>
  </div>
  <img id="chart" src="./sba_wwtemp_chart_metric.svg" alt="Santa Barbara lapse chart" />
</body>
</html>
