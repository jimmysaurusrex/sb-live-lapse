name: Validate Isolated Dew Point Beta
on:
  push:
    branches: [codex/cloud-beta]
    paths: ['beta/**', '.github/workflows/deploy-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dew-point-beta-validation
  cancel-in-progress: false
jobs:
  validate-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test primary and beta
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s beta/tests -v
          bash -n beta/deploy/install.sh beta/deploy/refresh.sh beta/deploy/publish.sh
